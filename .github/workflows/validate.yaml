name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Ruff and Hassfest
    runs-on: ubuntu-26.04
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Install Ruff
        run: pip install ruff
      - name: Run Ruff
        run: ruff check custom_components/ploc_cellar tests
      - name: Run Hassfest
        uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361 # pinned master snapshot

  type-check:
    name: Strict typing and tests (Home Assistant ${{ matrix.ha-version }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        ha-version: ["2026.10.4", "latest"]
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Install minimum supported Home Assistant
        if: matrix.ha-version == '2026.10.4'
        run: python -m pip install "homeassistant==2026.10.4" pytest pytest-cov
      - name: Install latest stable Home Assistant
        if: matrix.ha-version == 'latest'
        run: python -m pip install --upgrade homeassistant pytest pytest-cov
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
      - name: Install Pyright
        run: npm install --global pyright
      - name: Run strict Pyright
        run: pyright --project pyrightconfig.json
      - name: Run unit tests with coverage
        run: PYTHONPATH=custom_components pytest -q --cov=ploc_cellar --cov-report=term-missing --cov-report=xml --cov-fail-under=95

  hacs:
    name: HACS validation
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-26.04
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Validate HACS
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # pinned main snapshot
        with:
          category: integration
