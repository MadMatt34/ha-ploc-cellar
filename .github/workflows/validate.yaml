name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    name: Ruff and Hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install Ruff
        run: pip install ruff
      - name: Run Ruff
        run: ruff check custom_components/ploc_cellar
      - name: Run Hassfest
        uses: home-assistant/actions/hassfest@master

  type-check:
    name: Strict typing (HA ${{ matrix.ha-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.14.2"
            ha-version: "2026.8.2"
          - python-version: "3.14"
            ha-version: latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Home Assistant
        env:
          HA_VERSION: ${{ matrix.ha-version }}
        run: |
          if [ "$HA_VERSION" = "latest" ]; then
            pip install homeassistant
          else
            pip install "homeassistant==$HA_VERSION"
          fi
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Install Pyright
        run: npm install --global pyright
      - name: Run strict Pyright
        run: pyright --project pyrightconfig.json

  hacs:
    name: HACS validation
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Validate HACS
        uses: hacs/action@main
        with:
          category: integration
